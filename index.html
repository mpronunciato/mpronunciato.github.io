<style>
/* Layout: duas vistas (Portfólio e Sobre mim) num índice editorial de coluna larga; títulos expandidos e pesados, fios finos, contato no rodapé. Tema escuro único, por escolha. */
:root{
  --bg:#121211;          /* cinza quase preto, levemente quente */
  --surface:#1c1b1a;     /* placeholders de imagem */
  --line:#2c2b28;        /* fios e divisórias */
  --fg:#ece2c6;          /* off-white bege amarelado */
  --muted:#9d9682;       /* textos secundários */
  --accent:#00ff00;      /* destaque: verde do favicon (títulos de projetos) */
  --accent2:#ff8000;     /* destaque: laranja puro (bio, botões, chamada) */
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --max:1240px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{
  background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:var(--bg)}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{
  max-width:var(--max);margin:0 auto;
  padding-left:max(24px,env(safe-area-inset-left,0px));
  padding-right:max(24px,env(safe-area-inset-right,0px));
}
@media (max-width:480px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Cabeçalho */
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-stretch:110%;letter-spacing:-.01em;font-size:17px}
.brand img{width:28px;height:28px}
nav{display:flex;gap:6px}
nav a{font-size:15px;color:var(--muted);padding:6px 12px;border:1px solid transparent;border-radius:999px;transition:color .2s,border-color .2s}
nav a:hover{color:var(--fg)}
nav a[aria-current="page"]{color:var(--fg);border-color:var(--line)}
@media (max-width:420px){.brand span{display:none}}

/* Abertura das duas vistas */
.intro{padding-block:clamp(48px,9vw,112px) clamp(40px,6vw,72px)}
.intro h1{
  font-family:var(--display);font-weight:800;font-stretch:125%;
  font-size:clamp(2.4rem,7vw,6.6rem);line-height:.92;letter-spacing:-.035em;
  margin:0;text-wrap:balance;
}
.intro h1 span{display:block}
.intro h1 .leve{font-size:.5em;line-height:1.05;margin-top:.2em}
.intro .sub{
  margin:clamp(18px,3vw,28px) 0 0;font-weight:300;font-style:italic;
  font-size:clamp(1.1rem,1.8vw,1.4rem);color:var(--muted);
}
.lead{
  margin:clamp(40px,6vw,72px) 0 0;padding-top:28px;border-top:1px solid var(--line);
  font-size:clamp(1.35rem,2.6vw,2.1rem);line-height:1.28;font-weight:400;font-stretch:100%;
  letter-spacing:-.012em;max-width:34ch;text-wrap:pretty;
}
.lead em{font-style:normal;color:var(--accent2)}
.lead i{font-style:italic}
.lead b{font-weight:700}
.lead .laranja{color:var(--accent2)}
.lead .verde{color:var(--accent)}

/* Faixa de clientes */
.marquee{
  border-block:1px solid var(--line);overflow:hidden;padding-block:22px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
}
.marquee-track{display:flex;width:max-content;animation:marquee 60s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-group{display:flex;align-items:center;gap:64px;padding-right:64px}
.client{display:flex;align-items:center;gap:10px;white-space:nowrap;color:var(--muted);font-weight:500;font-size:clamp(1.1rem,1.8vw,1.45rem);letter-spacing:-.005em}
.client img{width:26px;height:26px;object-fit:contain;border-radius:5px}
.client .mono{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--fg);font-size:12px;font-weight:700}
@keyframes marquee{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marquee-track{animation:none}}

/* Trabalhos */
.works{padding-block:clamp(24px,4vw,48px)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 32px}
@media (max-width:720px){.grid{grid-template-columns:1fr;gap:44px}}
.card{display:flex;flex-direction:column;gap:16px}
.ph{position:relative;width:100%;max-width:100%;background:var(--surface);overflow:hidden;border-radius:2px}
.ph::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 22px,rgba(236,226,198,.025) 22px 23px)}
.ph span{position:absolute;left:14px;bottom:12px;z-index:1}
.card .ph{aspect-ratio:4/3;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph{transform:scale(1.012)}
.card-meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px}
.card h3{color:var(--accent);margin:0;font-size:clamp(1.3rem,2.2vw,1.7rem);font-weight:700;font-stretch:112%;letter-spacing:-.015em;line-height:1.1;text-wrap:balance}
.card .yr{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px}
.card .cl{grid-column:1/-1;color:var(--muted);font-size:15px}
.card:hover h3{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}

/* Projetos na home: cabeçalho + carrossel */
.proj{display:grid;gap:28px;padding-block:clamp(36px,5vw,64px) 0}
.proj-head{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.55fr) minmax(0,1.3fr);gap:20px 32px;align-items:start}
@media (max-width:900px){.proj-head{grid-template-columns:1fr}}
.proj-head .tags li{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px}
.proj-title{color:var(--accent);font-weight:800;font-stretch:118%;font-size:clamp(1.9rem,4.4vw,3.8rem);line-height:.95;letter-spacing:-.03em;margin:14px 0 0;text-wrap:balance}
.proj-title a:hover{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.proj-meta{display:grid;gap:4px;padding-top:6px}
.proj-meta .yr{font-family:var(--mono);font-size:13px;color:var(--fg);font-variant-numeric:tabular-nums}
.proj-desc p{margin:0;max-width:52ch;color:var(--fg)}
.proj-cta{display:inline-flex;margin-top:16px;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;transition:background .2s,color .2s,border-color .2s}
.proj-cta:hover{background:var(--accent2);border-color:var(--accent2);color:var(--bg)}
.carousel{display:block;position:relative;overflow:hidden;height:clamp(240px,36vw,540px);cursor:pointer}
.carousel-track{display:flex;height:100%;width:max-content;animation:slide var(--dur,60s) linear infinite}
.carousel:hover .carousel-track,.carousel:focus-visible .carousel-track{animation-play-state:paused}
.carousel-group{display:flex;gap:12px;padding-right:12px;height:100%}
.slide{flex:none;height:100%;width:auto;max-width:none;border-radius:3px;background:var(--surface);transition:filter .3s}
.carousel:hover .slide{filter:brightness(.6)}
.carousel .slide:hover{filter:none}
.carousel .pill{
  position:absolute;bottom:20px;left:max(24px,env(safe-area-inset-left,0px));
  background:var(--accent2);color:var(--bg);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;
  opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none;
}
.carousel:hover .pill,.carousel:focus-visible .pill{opacity:1;transform:none}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.carousel{overflow-x:auto}.carousel-track{animation:none}}

/* Sobre mim / currículo */
.cv{padding-block:clamp(16px,3vw,32px)}
.cv-sec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3fr);gap:24px;border-top:1px solid var(--line);padding-block:28px clamp(40px,6vw,64px)}
@media (max-width:720px){.cv-sec{grid-template-columns:1fr;gap:16px}}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:4px 24px;align-items:baseline;padding-block:16px;border-bottom:1px solid var(--line)}
.rows li:first-child{padding-top:0}
.rows li:last-child{border-bottom:0}
.rows .role{font-weight:600;font-stretch:108%;font-size:clamp(1.05rem,1.6vw,1.25rem);letter-spacing:-.01em}
.rows .org{color:var(--muted)}
.rows .areas{grid-column:1/-1;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.rows .when{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:560px){.rows li{grid-template-columns:minmax(0,1fr) auto}.rows .org{grid-column:1/-1;grid-row:2}}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.tags li{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px}
.intro-tags{margin-top:clamp(24px,3.5vw,36px)}

/* Contato */
footer{border-top:1px solid var(--line);margin-top:clamp(32px,6vw,64px)}
footer .wrap{padding-block:clamp(48px,8vw,96px) 40px}
.cta{color:var(--accent2);font-weight:800;font-stretch:125%;font-size:clamp(2rem,6vw,4.6rem);line-height:.95;letter-spacing:-.03em;margin:0 0 40px}
.contacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:1080px}
@media (max-width:820px){.contacts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.contacts strong{overflow-wrap:anywhere}
.contacts a{display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:1px solid var(--line)}
.contacts a strong{font-weight:500;font-size:clamp(1.05rem,1.8vw,1.3rem);transition:opacity .2s}
.contacts a:hover strong{opacity:.7}
@media (max-width:520px){.contacts{grid-template-columns:1fr}}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:72px}

/* Página de projeto */
.p-top{padding-block:clamp(32px,6vw,72px) 0}
.back{display:inline-flex;gap:8px;color:var(--muted);font-size:15px;transition:color .2s}
.back:hover{color:var(--fg)}
.p-title{color:var(--accent);font-weight:800;font-stretch:125%;font-size:clamp(2.2rem,7vw,6rem);line-height:.92;letter-spacing:-.035em;margin:clamp(28px,5vw,56px) 0 0;text-wrap:balance}
.p-info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:32px;border-top:1px solid var(--line);margin-top:clamp(32px,5vw,56px);padding-top:28px}
.p-facts{display:grid;gap:18px;align-content:start;margin:0}
.p-facts div{display:grid;gap:2px}
.p-facts dd{margin:0}
.p-text p{margin:0 0 1em;max-width:62ch;font-size:clamp(1rem,1.4vw,1.15rem)}
@media (max-width:720px){.p-info{grid-template-columns:1fr}}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding-block:clamp(40px,6vw,72px)}
.gallery .full{grid-column:1/-1}
.ph.has-img::after{display:none}
.gallery.colado,.gallery.colado .row{gap:0}
.gallery.colado .shot{border-radius:0}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot{display:block;width:100%;max-width:100%;height:auto;background:var(--surface);border-radius:2px}
.row{grid-column:1/-1;display:flex;gap:16px;align-items:flex-start}
.row .shot{flex:1 1 0;min-width:0}
@media (max-width:620px){.gallery{grid-template-columns:1fr}.gallery .full{grid-column:auto}.row{flex-direction:column}.row .shot{flex:none!important}}
.next{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-top:1px solid var(--line);padding-block:32px 8px}
.next strong{color:var(--accent);display:block;font-weight:800;font-stretch:118%;font-size:clamp(1.5rem,4vw,2.8rem);letter-spacing:-.025em;line-height:1;margin-top:8px}
.next:hover strong{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.arrow{font-size:clamp(1.5rem,4vw,2.8rem);line-height:1}
</style>
</head>
<body>

    <h1>${h1}</h1>
    <ul class="tags intro-tags">${TAGS.map(t => `<li>${esc(t)}</li>`).join("")}</ul>

}

/* Imagens e vídeos: .mp4/.webm viram vídeo em loop, mudo, que só toca quando está na tela */
const ehVideo = r => /\.(mp4|webm|mov)$/i.test(r);
const ehMidia = r => /^data:(image|video)|\.(jpe?g|png|webp|gif|avif|mp4|webm|mov)$/i.test(r);
function midia(src, cls, alt = ""){
  if (ehVideo(src) || src.startsWith("data:video"))
    return `<video class="${cls}" src="${esc(src)}#t=0.1" muted loop playsinline preload="metadata"
      onloadedmetadata="this.style.flexGrow=this.videoWidth/this.videoHeight"></video>`;
  return `<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy"
    onload="this.style.flexGrow=this.naturalWidth/this.naturalHeight">`;
}
let observador;
function ativarVideos(){
  if (observador) observador.disconnect();
  const parado = matchMedia("(prefers-reduced-motion: reduce)").matches;
  observador = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target; v.muted = true;
    if (e.isIntersecting && !parado) v.play().catch(() => {}); else v.pause();
  }), { rootMargin: "200px" });
  app.querySelectorAll("video").forEach(v => {
    /* vídeo que ainda não está na pasta vira um bloco cinza 16:9 */
    v.addEventListener("error", () => {
      const d = document.createElement("div");
      d.className = v.className; d.style.aspectRatio = "16/9";
      observador.unobserve(v); v.replaceWith(d);
    });
    observador.observe(v);
  });
}

function faixaClientes(){
  const item = c => `<span class="client">${c.icone ? `<img src="${esc(c.icone)}" alt="">` : `<span class="mono">${esc(c.nome.charAt(0).toUpperCase())}</span>`}${esc(c.nome)}</span>`;
  const grupo = Array(2).fill(CLIENTES.map(item).join("")).join("");
  return `<div class="marquee" aria-label="Clientes: ${esc(CLIENTES.map(c => c.nome).join(", "))}">
    <div class="marquee-track" aria-hidden="true">
      <div class="marquee-group">${grupo}</div><div class="marquee-group">${grupo}</div>
    </div>
  </div>`;
}

function portfolio(){
  app.innerHTML = intro("<span>O MUNDO É A REFERÊNCIA.</span> <span class='leve'>o design é a consequência.</span>") + faixaClientes() + `
  <section class="works">
    ${PROJETOS.map(p => `
      <article class="proj">
        <div class="proj-head wrap">
          <div>
            <ul class="tags">${p.areas.map(a => `<li>${esc(a)}</li>`).join("")}</ul>
            <h2 class="proj-title"><a href="#${p.slug}">${esc(p.titulo)}</a></h2>
          </div>
          <div class="proj-meta"><span class="yr">${esc(p.ano)}</span><span class="label">${esc(p.cliente)}</span></div>
          <div class="proj-desc">
            <p>${esc(p.resumo || p.texto[0])}</p>
            <a class="proj-cta" href="#${p.slug}">Ver projeto ↗</a>
          </div>
        </div>
        ${carrossel(p)}
      </article>`).join("")}
  </section>`;
}

function carrossel(p){
  const itens = (p.carrossel || p.imagens).flat();
  const slide = r => ehMidia(r) ? midia(r, "slide") : `<div class="slide" style="aspect-ratio:${esc(r)}"></div>`;
  const k = Math.max(1, Math.ceil(8 / itens.length));
  const grupo = Array(k).fill(itens.map(slide).join("")).join("");
  return `<a class="carousel" href="#${p.slug}" style="--dur:${itens.length * k * 7}s" aria-label="Ver projeto ${esc(p.titulo)}">
    <div class="carousel-track"><div class="carousel-group">${grupo}</div><div class="carousel-group" aria-hidden="true">${grupo}</div></div>
    <span class="pill">Ver projeto ↗</span>
  </a>`;
}

function sobre(){
  app.innerHTML = intro("sobre mim", true) + `
  <section class="cv wrap">
    <div class="cv-sec"><span class="label">Experiência</span>${lista(EXPERIENCIA)}</div>
    <div class="cv-sec"><span class="label">Formação</span>${lista(FORMACAO)}</div>
  </section>`;
}

function projeto(p){
  const prox = PROJETOS[(PROJETOS.indexOf(p) + 1) % PROJETOS.length];
  app.innerHTML = `
  <article>
    <div class="p-top wrap">
      <a class="back" href="#portfolio">← Portfólio</a>
      <h1 class="p-title">${esc(p.titulo)}</h1>
      <div class="p-info">
        <dl class="p-facts">
          <div><dt class="label">Cliente</dt><dd>${esc(p.cliente)}</dd></div>
          <div><dt class="label">Ano</dt><dd>${esc(p.ano)}</dd></div>
          <div><dt class="label">Área</dt><dd>${esc(p.areas.join(", "))}</dd></div>
          ${p.creditos ? `<div><dt class="label">Créditos</dt><dd>${esc(p.creditos)}</dd></div>` : ""}
        </dl>
        <div class="p-text">${p.texto.map(t => `<p>${esc(t)}</p>`).join("")}</div>
      </div>
    </div>
    <div class="gallery wrap${p.semEspaco ? " colado" : ""}">
      ${p.imagens.map((r, k) => {
        const foto = src => midia(src, "shot", p.titulo);
        if (Array.isArray(r)) return `<div class="row">${r.map(foto).join("")}</div>`;
        if (ehMidia(r)) return `<div class="full">${foto(r)}</div>`;
        const [w, h] = r.split("/").map(Number);
        return ph(r, `Imagem ${String(k+1).padStart(2,"0")} · ${w}:${h}`, w / h > 1.2 ? "full" : "");
      }).join("")}
    </div>
    <div class="wrap">
      <a class="next" href="#${prox.slug}">
        <span><span class="label">Próximo projeto</span><strong>${esc(prox.titulo)}</strong></span>
        <span class="arrow">→</span>
      </a>
    </div>
  </article>`;
}

function route(){
  const slug = location.hash.slice(1);
  const p = PROJETOS.find(x => x.slug === slug);
  let atual = "portfolio";
  if (p) projeto(p);
  else if (slug === "sobre") { sobre(); atual = "sobre"; }
  else portfolio();
  ativarVideos();
  document.querySelectorAll("[data-nav]").forEach(a =>
    a.dataset.nav === atual ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
