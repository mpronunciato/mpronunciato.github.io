<style>
/* Layout: duas vistas (Portfólio e Sobre mim) num índice editorial de coluna larga; títulos expandidos e pesados, fios finos, contato no rodapé. Tema escuro único, por escolha. */
:root{
  --bg:#121211;          /* cinza quase preto, levemente quente */
  --surface:#1c1b1a;     /* placeholders de imagem */
  --line:#2c2b28;        /* fios e divisórias */
  --fg:#ece2c6;          /* off-white bege amarelado */
  --muted:#9d9682;       /* textos secundários */
  --accent:#00ff00;      /* destaque: verde do favicon (títulos de projetos) */
  --accent2:#ff8000;     /* destaque: laranja puro (bio, botões, chamada) */
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --max:1240px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{
  background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:var(--bg)}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{
  max-width:var(--max);margin:0 auto;
  padding-left:max(24px,env(safe-area-inset-left,0px));
  padding-right:max(24px,env(safe-area-inset-right,0px));
}
@media (max-width:480px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Cabeçalho */
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-stretch:110%;letter-spacing:-.01em;font-size:17px}
.brand img{width:28px;height:28px}
nav{display:flex;gap:6px}
nav a{font-size:15px;color:var(--muted);padding:6px 12px;border:1px solid transparent;border-radius:999px;transition:color .2s,border-color .2s}
nav a:hover{color:var(--fg)}
nav a[aria-current="page"]{color:var(--fg);border-color:var(--line)}
@media (max-width:420px){.brand span{display:none}}

/* Abertura das duas vistas */
.intro{padding-block:clamp(48px,9vw,112px) clamp(40px,6vw,72px)}
.intro h1{
  font-family:var(--display);font-weight:800;font-stretch:125%;
  font-size:clamp(2.4rem,7vw,6.6rem);line-height:.92;letter-spacing:-.035em;
  margin:0;text-wrap:balance;
}
.intro h1 > span{display:block}
.intro h1 .linha{font-weight:400;font-stretch:110%}
.intro h1 .linha b{font-weight:800}
.intro h1 .l2{font-size:.6em;line-height:1.02;margin-top:.12em}
.intro h1 .l3{font-size:max(.34em, 16px);line-height:1.1;margin-top:.35em;letter-spacing:-.01em}
.intro h1 .menor{font-size:1em}
.intro h1 u{text-decoration-thickness:.06em;text-underline-offset:.12em}
.verde{color:var(--accent)}
.laranja{color:var(--accent2)}
.intro h1 .leve{font-size:.5em;line-height:1.05;margin-top:.2em}
.intro .sub{
  margin:clamp(18px,3vw,28px) 0 0;font-weight:300;font-style:italic;
  font-size:clamp(1.1rem,1.8vw,1.4rem);color:var(--muted);
}
.lead{
  margin:clamp(40px,6vw,72px) 0 0;padding-top:28px;border-top:1px solid var(--line);
  font-size:clamp(1.35rem,2.6vw,2.1rem);line-height:1.28;font-weight:400;font-stretch:100%;
  letter-spacing:-.012em;max-width:34ch;text-wrap:pretty;
}
.lead em{font-style:normal;color:var(--accent2)}
.lead i{font-style:italic}
.lead b{font-weight:700}
.lead .laranja{color:var(--accent2)}
.lead .verde{color:var(--accent)}

/* Faixa de clientes */
.marquee{
  border-block:1px solid var(--line);overflow:hidden;padding-block:22px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
}
.marquee-track{display:flex;width:max-content;animation:marquee 60s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-group{display:flex;align-items:center;gap:64px;padding-right:64px}
.client{display:flex;align-items:center;gap:10px;white-space:nowrap;color:var(--muted);font-weight:500;font-size:clamp(1.1rem,1.8vw,1.45rem);letter-spacing:-.005em}
.client img{width:28px;height:28px;object-fit:contain;border-radius:7px;background:#fff;padding:4px;box-sizing:border-box;flex:none}
.client .mono{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--fg);font-size:12px;font-weight:700}
@keyframes marquee{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marquee-track{animation:none}}

/* Trabalhos */
.works{padding-block:clamp(24px,4vw,48px)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 32px}
@media (max-width:720px){.grid{grid-template-columns:1fr;gap:44px}}
.card{display:flex;flex-direction:column;gap:16px}
.ph{position:relative;width:100%;max-width:100%;background:var(--surface);overflow:hidden;border-radius:2px}
.ph::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 22px,rgba(236,226,198,.025) 22px 23px)}
.ph span{position:absolute;left:14px;bottom:12px;z-index:1}
.card .ph{aspect-ratio:4/3;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph{transform:scale(1.012)}
.card-meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px}
.card h3{color:var(--accent);margin:0;font-size:clamp(1.3rem,2.2vw,1.7rem);font-weight:700;font-stretch:112%;letter-spacing:-.015em;line-height:1.1;text-wrap:balance}
.card .yr{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px}
.card .cl{grid-column:1/-1;color:var(--muted);font-size:15px}
.card:hover h3{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}

/* Projetos na home: cabeçalho + carrossel */
.proj{display:grid;gap:28px;padding-block:clamp(36px,5vw,64px) 0}
.proj-head{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.55fr) minmax(0,1.3fr);gap:20px 32px;align-items:start}
@media (max-width:900px){.proj-head{grid-template-columns:1fr}}
.proj-head .tags li{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px}
.proj-title{color:var(--accent);font-weight:800;font-stretch:118%;font-size:clamp(1.9rem,4.4vw,3.8rem);line-height:.95;letter-spacing:-.03em;margin:14px 0 0;text-wrap:balance}
.proj-title a:hover{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.proj-meta{display:grid;gap:4px;padding-top:6px}
.proj-meta .yr{font-family:var(--mono);font-size:13px;color:var(--fg);font-variant-numeric:tabular-nums}
.proj-desc p{margin:0;max-width:52ch;color:var(--fg)}
.proj-cta{display:inline-flex;margin-top:16px;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;transition:background .2s,color .2s,border-color .2s}
.proj-cta:hover{background:var(--accent2);border-color:var(--accent2);color:var(--bg)}
.carousel{display:block;position:relative;overflow:hidden;height:clamp(240px,36vw,540px);cursor:pointer}
.carousel-track{display:flex;height:100%;width:max-content;animation:slide var(--dur,60s) linear infinite}
.carousel:hover .carousel-track,.carousel:focus-visible .carousel-track{animation-play-state:paused}
.carousel-group{display:flex;gap:12px;padding-right:12px;height:100%}
.slide{flex:none;height:100%;width:auto;max-width:none;border-radius:3px;background:var(--surface);transition:filter .3s}
.carousel:hover .slide{filter:brightness(.6)}
.carousel .slide:hover{filter:none}
.carousel .pill{
  position:absolute;bottom:20px;left:max(24px,env(safe-area-inset-left,0px));
  background:var(--accent2);color:var(--bg);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;
  opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none;
}
.carousel:hover .pill,.carousel:focus-visible .pill{opacity:1;transform:none}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.carousel{overflow-x:auto}.carousel-track{animation:none}}

/* Sobre mim — grade de 4 colunas: bio/nome/tags | cargo | áreas */
.sb{--g:clamp(20px,3vw,40px);padding-block:clamp(40px,7vw,96px) clamp(24px,4vw,48px)}
.sb-titulo{font-family:var(--display);font-weight:800;font-stretch:100%;font-size:clamp(3rem,10vw,8.5rem);line-height:.85;letter-spacing:-.05em;margin:0 0 clamp(40px,6vw,80px);text-wrap:balance}
.sb-grid,.sb-contatos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--g)}
.sb-esq{display:flex;flex-direction:column;gap:clamp(28px,3.5vw,44px);align-items:flex-start;min-width:0}
.sb-bio{margin:0;max-width:44ch;font-size:clamp(15px,1.25vw,17px);line-height:1.5;text-wrap:pretty}
.sb-bio .laranja{color:var(--accent2)}.sb-bio .verde{color:var(--accent)}
.sb-nome{display:grid;gap:2px;font-size:clamp(1.6rem,2.8vw,2.4rem);line-height:1.1;letter-spacing:-.02em}
.sb-nome b{font-weight:700;color:var(--accent2)}
.sb-nome span{font-weight:300}
.sb-tags{max-width:460px;gap:6px}
.sb-tags li{font-size:14px;padding:4px 12px}
.sb-dir{display:grid;gap:clamp(48px,7vw,96px);min-width:0;align-content:start}
.sb-rot{grid-column:1/-1;margin:0 0 clamp(20px,2.5vw,32px);font-size:14px;font-weight:400;color:var(--muted)}
.sb-bloco,.sb-item{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--g)}
.sb-lista{grid-column:1/-1;list-style:none;margin:0;padding:0;display:grid;gap:clamp(40px,5.5vw,72px)}
.sb-form .sb-rot{grid-column:1}
.sb-form .sb-lista{grid-column:2}
.sb-cargo{display:grid;gap:2px;font-size:15px;line-height:1.35}
.sb-cargo b{font-weight:500;text-transform:uppercase;letter-spacing:.02em}
.sb-areas{margin:0;font-size:15px;line-height:1.35;font-style:italic;color:var(--fg);opacity:.85;padding-top:1.35em}
.sb-areas span{white-space:nowrap}
.sb-cta{color:var(--accent2);font-family:var(--display);font-weight:800;font-stretch:100%;font-size:clamp(2rem,5.2vw,4.4rem);line-height:.92;letter-spacing:-.04em;margin:clamp(72px,10vw,140px) 0 clamp(28px,3.5vw,44px);text-wrap:balance}
.sb-contatos{margin-top:0}
.sb-contatos > div{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--g)}
.sb-contatos a{display:grid;gap:6px;align-content:start;min-width:0}
.sb-contatos .rot{font-size:13px;color:var(--muted)}
.sb-contatos strong{font-weight:400;font-size:clamp(1.05rem,1.6vw,1.35rem);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;overflow-wrap:anywhere;transition:color .2s}
.sb-contatos a:hover strong{color:var(--accent2)}
html[data-pagina="sobre"] footer .contacts,html[data-pagina="sobre"] footer .cta{display:none}
html[data-pagina="sobre"] footer .wrap{padding-block:28px}
@media (max-width:900px){
  .sb-grid{grid-template-columns:1fr;gap:clamp(56px,10vw,80px)}
  .sb-contatos{grid-template-columns:1fr;gap:28px}
}
@media (max-width:520px){
  .sb-bloco,.sb-item,.sb-contatos > div{grid-template-columns:1fr;gap:6px}
  .sb-form .sb-rot,.sb-form .sb-lista{grid-column:1}
  .sb-areas{padding-top:4px}
  .sb-contatos > div{gap:28px}
}

/* Sobre mim / currículo (antigo) */
.cv{padding-block:clamp(16px,3vw,32px)}
.cv-sec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3fr);gap:24px;border-top:1px solid var(--line);padding-block:28px clamp(40px,6vw,64px)}
@media (max-width:720px){.cv-sec{grid-template-columns:1fr;gap:16px}}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:4px 24px;align-items:baseline;padding-block:16px;border-bottom:1px solid var(--line)}
.rows li:first-child{padding-top:0}
.rows li:last-child{border-bottom:0}
.rows .role{font-weight:600;font-stretch:108%;font-size:clamp(1.05rem,1.6vw,1.25rem);letter-spacing:-.01em}
.rows .org{color:var(--muted)}
.rows .areas{grid-column:1/-1;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.rows .when{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:560px){.rows li{grid-template-columns:minmax(0,1fr) auto}.rows .org{grid-column:1/-1;grid-row:2}}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.tags li{border:1px solid var(--accent2);border-radius:999px;padding:6px 14px;font-size:15px}
.intro-tags{margin-top:clamp(24px,3.5vw,36px)}

/* Contato */
footer{border-top:1px solid var(--line);margin-top:clamp(32px,6vw,64px)}
footer .wrap{padding-block:clamp(48px,8vw,96px) 40px}
.cta{color:var(--accent2);font-weight:800;font-stretch:125%;font-size:clamp(2rem,6vw,4.6rem);line-height:.95;letter-spacing:-.03em;margin:0 0 40px}
.contacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:1080px}
@media (max-width:820px){.contacts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.contacts strong{overflow-wrap:anywhere}
.contacts a{display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:1px solid var(--line)}
.contacts a strong{font-weight:500;font-size:clamp(1.05rem,1.8vw,1.3rem);transition:opacity .2s}
.contacts a:hover strong{opacity:.7}
@media (max-width:520px){.contacts{grid-template-columns:1fr}}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:72px}

.p-top{padding-block:clamp(32px,6vw,72px) 0}
.back{display:inline-flex;gap:8px;color:var(--muted);font-size:15px;transition:color .2s}
.back:hover{color:var(--fg)}
.p-title{color:var(--accent);font-weight:800;font-stretch:125%;font-size:clamp(2.2rem,7vw,6rem);line-height:.92;letter-spacing:-.035em;margin:clamp(28px,5vw,56px) 0 0;text-wrap:balance}
.p-info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:32px;border-top:1px solid var(--line);margin-top:clamp(32px,5vw,56px);padding-top:28px}
.p-facts{display:grid;gap:18px;align-content:start;margin:0}
.p-facts div{display:grid;gap:2px}
.p-facts dd{margin:0}
.p-facts .creditos{display:grid;gap:10px;margin-top:4px}
.p-facts .creditos span{display:grid;gap:1px}
.p-facts .creditos small{font-size:13px;color:var(--muted)}
.p-facts .creditos .respiro{height:4px}
.p-text p{margin:0 0 1em;max-width:62ch;font-size:clamp(1rem,1.4vw,1.15rem)}
@media (max-width:720px){.p-info{grid-template-columns:1fr}}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding-block:clamp(40px,6vw,72px)}
.gallery .full{grid-column:1/-1}
.ph.has-img::after{display:none}
.gallery.colado,.gallery.colado .row{gap:0}
.gallery.colado .shot{border-radius:0}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot{display:block;width:100%;max-width:100%;height:auto;background:var(--surface);border-radius:2px}
.row{grid-column:1/-1;display:flex;gap:16px;align-items:flex-start}
.row .shot{flex:1 1 0;min-width:0}
@media (max-width:620px){.gallery{grid-template-columns:1fr}.gallery .full{grid-column:auto}.row{flex-direction:column}.row .shot{flex:none!important}}
.next{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-top:1px solid var(--line);padding-block:32px 8px}
.next strong{color:var(--accent);display:block;font-weight:800;font-stretch:118%;font-size:clamp(1.5rem,4vw,2.8rem);letter-spacing:-.025em;line-height:1;margin-top:8px}
.next:hover strong{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.arrow{font-size:clamp(1.5rem,4vw,2.8rem);line-height:1}

[hidden]{display:none!important}
/* ================================================================
   BOTÃO FIXO DE CONTATO
   ================================================================ */
.fab{
  position:fixed;z-index:60;
  right:calc(env(safe-area-inset-right,0px) + 16px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  display:flex;flex-direction:column-reverse;align-items:flex-end;gap:10px;
  transition:opacity .3s,transform .3s;
}
.fab.escondido{opacity:0;transform:translateY(14px);pointer-events:none}
.fab-btn{
  font:600 15px var(--body);background:var(--accent2);color:var(--bg);
  border:0;border-radius:999px;padding:12px 20px;cursor:pointer;
  box-shadow:0 10px 30px rgba(255,128,0,.28);transition:transform .2s;
}
.fab-btn:hover{transform:translateY(-2px)}
.fab-btn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.fab-painel{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;
  display:grid;min-width:min(280px,calc(100vw - 32px));box-shadow:0 20px 50px rgba(0,0,0,.5);
}
.fab-painel a{display:grid;gap:2px;padding:10px 12px;border-radius:10px;font-size:15px}
.fab-painel a:hover,.fab-painel a:focus-visible{background:var(--line);outline:none}

/* ================================================================
   PROJETO — leitura / folha de contato
   ================================================================ */
.p-modos{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-block:clamp(32px,5vw,56px) 0}
.modos{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.modos button{font:500 14px var(--body);color:var(--muted);background:none;border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
.modos button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.modos button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.dica kbd{font:inherit;border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-inline:2px}
.p-modos + .gallery{padding-top:20px}
.folha{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding-block:20px clamp(40px,6vw,72px)}
.miniatura{
  position:relative;aspect-ratio:4/3;background:var(--surface);border:1px solid var(--line);
  border-radius:4px;overflow:hidden;padding:0;cursor:pointer;transition:border-color .2s,transform .2s;
}
.miniatura img,.miniatura video{width:100%;height:100%;object-fit:cover;display:block}
.miniatura span{position:absolute;left:6px;bottom:5px;font:500 11px var(--mono);color:var(--fg);background:rgba(0,0,0,.55);padding:2px 6px;border-radius:999px}
.miniatura:hover,.miniatura:focus-visible{border-color:var(--accent2);transform:translateY(-2px);outline:none}
.gallery .shot.marcado{outline:2px solid var(--accent2);outline-offset:4px;transition:outline-color 1.2s}

/* easter egg das sobremesas */
.lead .sobremesa{cursor:pointer;text-decoration:underline dotted;text-underline-offset:5px;text-decoration-thickness:2px}
.lead .sobremesa:focus-visible{outline:2px solid var(--accent2);outline-offset:3px;border-radius:3px}
.doce{position:fixed;top:-60px;z-index:65;pointer-events:none;animation:cair var(--d) cubic-bezier(.35,.1,.6,1) var(--atraso) forwards}
@keyframes cair{to{transform:translateY(calc(100vh + 120px)) rotate(var(--giro))}}
.aviso{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:65;background:var(--accent2);color:var(--bg);font-weight:600;padding:10px 18px;border-radius:999px}


/* ================================================================
   HOME — PILHA DE CARTAS
   ================================================================ */
.carousel.reverso .carousel-track{animation-direction:reverse}
.pilha{padding-block:clamp(40px,6vw,80px) 0;display:block}
.carta{position:sticky;top:calc(20px + var(--i) * 14px);margin-bottom:7vh;transform-origin:50% 0;will-change:transform}
.carta:last-child{margin-bottom:0}
.carta-in{

  background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;

}
.carta-topo{
  display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,.9fr);gap:20px 36px;align-items:start;
  padding:clamp(20px,2.6vw,34px);
}
.carta-num{font:500 13px var(--mono);color:var(--muted);letter-spacing:.06em;padding-top:12px;font-variant-numeric:tabular-nums}
.carta .proj-title{margin:0}
.carta-titulo .tags{margin-top:16px;gap:6px}
.carta-titulo .tags li{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px}
.carta-lado{display:grid;gap:12px;align-content:start}
.carta-lado p{margin:0;color:var(--fg);max-width:46ch}
.carta-lado .proj-cta{justify-self:start;margin-top:4px}

.carta .carousel-track{height:100%}
@media (max-width:900px){

/* Imagens e vídeos: .mp4/.webm viram vídeo em loop, mudo, que só toca quando está na tela */
const ehVideo = r => /\.(mp4|webm|mov)$/i.test(r);
const ehMidia = r => /^data:(image|video)|\.(jpe?g|png|webp|gif|avif|mp4|webm|mov)$/i.test(r);
function midia(src, cls, alt = ""){
  if (ehVideo(src) || src.startsWith("data:video"))
    return `<video class="${cls}" src="${esc(src)}#t=0.1" muted loop playsinline preload="metadata"
      onloadedmetadata="this.style.flexGrow=this.videoWidth/this.videoHeight"></video>`;
  return `<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy"
    onload="this.style.flexGrow=this.naturalWidth/this.naturalHeight">`;
}
let observador;
function ativarVideos(){
  if (observador) observador.disconnect();
  const parado = matchMedia("(prefers-reduced-motion: reduce)").matches;
  observador = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target; v.muted = true;
    if (e.isIntersecting) v.play().catch(() => {}); else v.pause();
  }), { rootMargin: "200px" });
  app.querySelectorAll("video").forEach(v => {
    /* vídeo que ainda não está na pasta vira um bloco cinza 16:9 */
    v.addEventListener("error", () => {
      const d = document.createElement("div");
      d.className = v.className; d.style.aspectRatio = "16/9";
      observador.unobserve(v); v.replaceWith(d);
    });
    observador.observe(v);
  });
}

/* fundo: cinza no topo, clareia até o bege quando as cartas chegam e escurece de novo antes do rodapé */
const ESCURO = [18, 18, 17], CLARO = [236, 226, 198];
let fundoLigado = false;
function fundo(){
  const aplicar = () => {
    const pilhaEl = document.querySelector(".pilha");
    if (!pilhaEl) { document.body.style.backgroundColor = ""; return; }
    const vh = innerHeight, b = pilhaEl.getBoundingClientRect();
    const entra = (vh * .7 - b.top) / (vh * .45);     /* começa quando o topo das cartas aparece embaixo */
    const rod = document.querySelector("footer"), fim = rod ? rod.getBoundingClientRect().top : b.bottom;
       const sai = (fim - vh * .3) / (vh * .5);    /* volta ao escuro quando a última carta vai embora */
    const t = Math.min(1, Math.max(0, Math.min(entra, sai)));
    const e = t * t * (3 - 2 * t);                      /* suaviza o começo e o fim */
    const c = ESCURO.map((v, i) => Math.round(v + (CLARO[i] - v) * e));
    document.body.style.backgroundColor = `rgb(${c.join(",")})`;
  };
  if (!fundoLigado) {
    fundoLigado = true;
    let pedido = 0;
    const pedir = () => { if (!pedido) pedido = requestAnimationFrame(() => { pedido = 0; aplicar(); }); };
    addEventListener("scroll", pedir, { passive: true });
    addEventListener("resize", pedir);
  }
  aplicar();
}

function carrossel(p, i = 0){
  const itens = (p.carrossel || p.imagens).flat();
  const slide = r => ehMidia(r) ? midia(r, "slide") : `<div class="slide" style="aspect-ratio:${esc(r)}"></div>`;
  const k = Math.max(1, Math.ceil(8 / itens.length));
  const grupo = Array(k).fill(itens.map(slide).join("")).join("");
  return `<a class="carousel${i % 2 ? " reverso" : ""}" href="#${p.slug}" style="--dur:${itens.length * k * 7}s" aria-label="Ver projeto ${esc(p.titulo)}">
    <div class="carousel-track"><div class="carousel-group">${grupo}</div><div class="carousel-group" aria-hidden="true">${grupo}</div></div>
    <span class="pill">Ver projeto ↗</span>
  </a>`;
}

/* a carta de baixo encolhe e escurece conforme a próxima a cobre */
let pilhaLigada = false;
function pilha(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const tick = () => {
    raf = 0;
    const cartas = [...document.querySelectorAll(".carta")];
    cartas.forEach((c, i) => {
      const prox = cartas[i + 1];
      if (!prox) { c.style.transform = ""; c.firstElementChild.style.filter = ""; return; }
      const a = c.getBoundingClientRect(), b = prox.getBoundingClientRect();
      const cobre = Math.min(1, Math.max(0, (a.bottom - b.top) / a.height));
      c.style.transform = `scale(${1 - cobre * .07})`;
      c.firstElementChild.style.filter = `brightness(${1 - cobre * .5})`;
    });
  };
  let raf = 0;
  if (!pilhaLigada) {
    pilhaLigada = true;
    const pedir = () => { if (!raf) raf = requestAnimationFrame(tick); };
    addEventListener("scroll", pedir, { passive: true });
    addEventListener("resize", pedir);
  }
  tick();
}

        if (ehMidia(r)) return `<div class="full">${foto(r)}</div>`;
        const [w, h] = r.split("/").map(Number);
        return ph(r, `Imagem ${String(k+1).padStart(2,"0")} · ${w}:${h}`, w / h > 1.2 ? "full" : "");
      }).join("")}
    </div>
    <div class="wrap">
      <a class="next" href="#${prox.slug}" data-cursor="próximo">
        <span><span class="label">Próximo projeto</span><strong>${esc(prox.titulo)}</strong></span>
        <span class="arrow">→</span>
      </a>
    </div>
  </article>`;

  const folha = app.querySelector(".folha");
  const galeria = app.querySelector(".gallery");
  const abas = [...app.querySelectorAll(".modos button")];
  const modo = m => {
    abas.forEach(b => b.setAttribute("aria-selected", b.dataset.modo === m));
    folha.hidden = m !== "folha";
    galeria.hidden = m === "folha";
  };
  abas.forEach(b => b.addEventListener("click", () => modo(b.dataset.modo)));
  folha.addEventListener("click", e => {
    const b = e.target.closest(".miniatura"); if (!b) return;
    modo("leitura");
    const alvo = galeria.querySelectorAll(".shot")[+b.dataset.i];
    if (alvo) {
      alvo.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      alvo.classList.add("marcado"); setTimeout(() => alvo.classList.remove("marcado"), 1600);
    }
  });
}

/* setas do teclado passam de um projeto para outro */
document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey || !/Arrow(Left|Right)/.test(e.key)) return;
  if (e.target.closest && e.target.closest(".modos, .regua")) return;
  const i = PROJETOS.findIndex(x => x.slug === location.hash.slice(1));
  if (i < 0) return;
  const n = PROJETOS.length;
  location.hash = PROJETOS[(i + (e.key === "ArrowRight" ? 1 : n - 1)) % n].slug;
});

function route(){
  document.body.style.backgroundColor = "";
  const slug = location.hash.slice(1);
  const p = PROJETOS.find(x => x.slug === slug);
  let atual = "portfolio";
  if (p) { projeto(p); atual = "projeto"; }
  else if (slug === "sobre") { sobre(); atual = "sobre"; }
  else portfolio();
  document.documentElement.dataset.pagina = atual === "portfolio" ? "home" : atual;
  ativarVideos();
  document.querySelectorAll("[data-nav]").forEach(a =>
    a.dataset.nav === atual ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
